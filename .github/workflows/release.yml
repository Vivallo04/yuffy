name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label (e.g. 0.1.0-beta)'
        required: false
        default: 'dev'

env:
  DOTNET_VERSION: '9.0.x'
  PROJECT_PATH: Yuffy/Yuffy.csproj
  PUBLISH_FLAGS: '-p:PublishReadyToRun=false -p:TieredCompilation=false --self-contained'

jobs:
  # ============================================================
  # Windows build
  # ============================================================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install Minecraft font
        shell: pwsh
        run: |
          $fontPath = "Yuffy/Content/fonts/Minecraft.ttf"
          $destDir = "$env:LOCALAPPDATA\Microsoft\Windows\Fonts"
          if (!(Test-Path $destDir)) { New-Item -ItemType Directory -Path $destDir -Force }
          Copy-Item $fontPath $destDir -Force
          # Register font for current session
          $regPath = "HKCU:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Fonts"
          New-ItemProperty -Path $regPath -Name "Minecraft (TrueType)" -Value "$destDir\Minecraft.ttf" -PropertyType String -Force

      - name: Publish
        run: dotnet publish ${{ env.PROJECT_PATH }} -c Release -r win-x64 ${{ env.PUBLISH_FLAGS }}

      - name: Package
        shell: pwsh
        run: |
          $publishDir = "Yuffy/bin/Release/net9.0/win-x64/publish"
          Compress-Archive -Path "$publishDir/*" -DestinationPath "Yuffy-win-x64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yuffy-win-x64
          path: Yuffy-win-x64.zip
          retention-days: 7

  # ============================================================
  # Linux build
  # ============================================================
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install Minecraft font
        run: |
          mkdir -p ~/.fonts
          cp Yuffy/Content/fonts/Minecraft.ttf ~/.fonts/
          fc-cache -fv

      - name: Publish
        run: dotnet publish ${{ env.PROJECT_PATH }} -c Release -r linux-x64 ${{ env.PUBLISH_FLAGS }}

      - name: Package
        run: |
          cd Yuffy/bin/Release/net9.0/linux-x64/publish
          tar -czf "$GITHUB_WORKSPACE/Yuffy-linux-x64.tar.gz" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yuffy-linux-x64
          path: Yuffy-linux-x64.tar.gz
          retention-days: 7

  # ============================================================
  # macOS build (universal binary)
  # ============================================================
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install Minecraft font
        run: cp Yuffy/Content/fonts/Minecraft.ttf ~/Library/Fonts/

      - name: Publish (x64)
        run: dotnet publish ${{ env.PROJECT_PATH }} -c Release -r osx-x64 ${{ env.PUBLISH_FLAGS }}

      - name: Publish (arm64)
        run: dotnet publish ${{ env.PROJECT_PATH }} -c Release -r osx-arm64 ${{ env.PUBLISH_FLAGS }}

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Create .app bundle
        run: bash build/create-macos-bundle.sh "${{ steps.version.outputs.version }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yuffy-macos-universal
          path: Yuffy-macos-universal.tar.gz
          retention-days: 7

  # ============================================================
  # Create GitHub Release (only on tag push)
  # ============================================================
  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/Yuffy-win-x64/Yuffy-win-x64.zip
            artifacts/Yuffy-linux-x64/Yuffy-linux-x64.tar.gz
            artifacts/Yuffy-macos-universal/Yuffy-macos-universal.tar.gz
